# PASE Configuration File

# Data paths
data:
  pdb_dir: "data/pdb"
  asbench_dir: "data/asbench"
  asbench_file: "data/asbench/ASBench_Core_Set.xls"
  processed_dir: "data/processed"
  
# Output paths
output:
  models_dir: "outputs/models"
  figures_dir: "outputs/figures"
  logs_dir: "logs"

# Data processing
preprocessing:
  # Distance threshold for KNN graph construction (Angstroms)
  knn_k: 10
  distance_threshold: 10.0
  
  # Negative sampling
  negative_sampling:
    exclusion_radius: 10.0  # Exclude residues within this distance of allosteric sites
    exclude_active_sites: true
    stratify_by_sasa: true
    stratify_by_secondary_structure: true
    positive_negative_ratio: 1.0  # 1:1 ratio, adjust as needed
  
  # Feature computation
  compute_sasa: true
  compute_depth: true
  compute_secondary_structure: true

# Model architecture
model:
  type: "gvp_gnn"
  
  # GVP dimensions (scalar_dim, vector_dim)
  node_input_dim: [20, 3]  # scalar features, vector features
  node_hidden_dim: [128, 16]
  edge_input_dim: [1, 1]  # distance (scalar), direction (vector)
  edge_hidden_dim: [32, 1]
  
  # Architecture
  num_layers: 4
  dropout: 0.2
  
  # Output head
  mlp_hidden_dims: [256, 128]
  mlp_dropout: 0.3

# Training
training:
  # Data split
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  
  # Optimization
  batch_size: 8  # Number of proteins per batch
  num_epochs: 100
  learning_rate: 0.0005
  weight_decay: 0.0001
  
  # Learning rate scheduler
  lr_scheduler: "reduce_on_plateau"
  lr_patience: 10
  lr_factor: 0.5
  
  # Early stopping
  early_stopping_patience: 20
  early_stopping_metric: "val_f1"
  
  # Loss function
  loss_type: "weighted_bce"  # Options: "weighted_bce", "focal_loss"
  focal_loss_alpha: 0.25
  focal_loss_gamma: 2.0
  
  # Mixed precision training
  use_amp: true
  
  # Gradient accumulation
  gradient_accumulation_steps: 1

# Evaluation
evaluation:
  metrics:
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    - "pr_auc"
  
  # Top-K metrics for ranking
  top_k_values: [5, 10, 20]
  
  # Threshold for binary classification
  decision_threshold: 0.5

# Logging
logging:
  level: "INFO"
  use_tensorboard: true
  use_wandb: false
  wandb_project: "pase-allosteric-prediction"
  save_checkpoint_every: 5  # epochs

# Hardware
hardware:
  device: "cuda"  # Options: "cuda", "cpu", "mps" (for Apple Silicon)
  num_workers: 4
  pin_memory: true

# Reproducibility
reproducibility:
  seed: 42
  deterministic: true

